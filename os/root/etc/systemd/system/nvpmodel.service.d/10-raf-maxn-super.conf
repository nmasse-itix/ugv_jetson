# Pin MAXN_SUPER instead of the config default (25W), which caps the CPU at
# 1344 MHz — 22% slower for the same power budget. See docs/Reference/TESTS.md §14.
#
# The leading `-` is deliberate: a missing or unreadable helper must degrade to
# the stock profile, never fail the unit and take the boot with it.
[Service]
ExecStartPost=-/usr/libexec/raf-nvpmodel-pin
