# Root podman looks for registry credentials in /run/containers/0/auth.json and
# nowhere else — not /etc/containers/auth.json, despite the name.
#
# The node already holds credentials for our organisation: the Kickstart drops
# the registry pull secret in /etc/ostree/auth.json for bootc. Point one at the
# other, and `podman pull` of a private repository works on the node and in
# every quadlet without a per-command --authfile. The base-images mirror is
# private, so the ollama quadlet depends on this.
d /run/containers     0755 root root -
d /run/containers/0   0700 root root -
L+ /run/containers/0/auth.json - - - - /etc/ostree/auth.json
