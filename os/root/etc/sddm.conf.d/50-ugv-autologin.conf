# Boot straight into the admin desktop: the robot has no keyboard, and the
# screen (or rustdesk) must show a session without anyone typing a password.
# X11 rather than Wayland: rustdesk and the X11 forwarding into the demo
# container (DISPLAY=:0) both need it.
[Autologin]
Relogin=true
Session=plasmax11.desktop
User=admin

[General]
DisplayServer=X11
