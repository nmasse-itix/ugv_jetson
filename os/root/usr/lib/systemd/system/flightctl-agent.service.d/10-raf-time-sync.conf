# Hold the agent until the clock is real.
#
# WORKAROUND UPS-0004 -- docs/Upstream/UPS-0004-flightctl-agent-systemd-unit.md
#
# The Jetson Orin Nano has no RTC -- assumed, not a defect to fix. Every boot
# therefore starts at the image build date and stays there until chronyd reaches
# a server, roughly 10 s in. Started at its normal time, the agent bootstraps
# against a date months in the past and every TLS handshake fails closed:
#
#   x509: certificate has expired or is not yet valid:
#   current time 2026-05-12T00:00:08Z is before 2026-08-05T16:38:06Z
#
# (observed on judge, 2026-09-18). Restart=always eventually gets the agent
# connected, but enrollment, the first status push and the first spec fetch are
# already lost by then.
#
# Wants= is what pulls time-sync.target into the boot transaction; chrony-wait.service
# -- enabled in the Containerfile, and *not* on by preset -- is ordered Before= it,
# which is what gives that target its meaning. Without chrony-wait, time-sync.target
# is reached immediately and this ordering buys nothing.
#
# Worst case is bounded: with no NTP server reachable, chrony-wait gives up after its
# own TimeoutStartSec=180 and the target is reached regardless, because a unit that
# fails while ordered Before= does not block what comes after it. So this delays the
# agent by at most 3 minutes, and only on a node with no network -- where the agent
# has nothing to talk to anyway.
[Unit]
After=time-sync.target
Wants=time-sync.target
