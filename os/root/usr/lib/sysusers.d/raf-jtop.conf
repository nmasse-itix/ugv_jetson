# Declare the jtop group the image-mode way — same reason as raf-avahi.conf.
#
# jetson-stats creates this group from its *installer* (`groupadd jtop`, in
# jtop/service.py's set_service_permission), and that installer never runs here:
# the image is built on a plain aarch64 host, not a Tegra. Without the group the
# daemon exits at startup with
#
#     [ERROR] jtop.service - Group jtop does not exist!
#
# and — because it exits cleanly — the unit reports `inactive`, not `failed`. The
# node stays `running` with no failed units and jtop simply is not there.
#
# The group owns /run/jtop.sock at 0660 (jtop/service.py, JtopServer.start), which
# is how a non-root user reads the telemetry. Add someone with:
#
#     usermod -aG jtop <user>
#
# A fixed gid (950): the demo container is granted the group by number (see
# flightctl/apps/ugv-demo/etc/containers/systemd/nvidia-jetpack.container), so it must not move.
g jtop 950
