# Declare the avahi user the image-mode way.
#
# The avahi RPM creates it from a %pre scriptlet (groupadd -g 70 / useradd -u 70),
# which writes to /etc/passwd at *build* time. In bootc, /etc is a 3-way merge on
# upgrade: a node that already has its own /etc/passwd keeps it, the new entry
# never lands, and avahi-daemon dies at boot with
#
#     Failed to find user 'avahi'.
#
# Observed on robot B, 2026-08-21, on the first `bootc switch` carrying avahi. A
# fresh ISO install would have worked, which is exactly what makes it a trap: the
# bug only appears on the upgrade path.
#
# systemd-sysusers is the answer, and the house style here -- /usr/lib/sysusers.d
# already carries a dozen of these. It is image content, so it cannot be shadowed
# by the node's /etc, and systemd-sysusers.service re-applies it at every boot,
# before basic.target and therefore before avahi.
#
# Values mirror the RPM scriptlet exactly (rpm -q --scripts avahi).
#
# The general rule, for the next package that ships a user: in image mode, a user
# created by an RPM scriptlet is not a user the fleet has. Declare it here.
g avahi 70
u avahi 70:avahi "Avahi mDNS/DNS-SD Stack" /var/run/avahi-daemon /sbin/nologin
