# Writable home for jetson-stats' service state.
#
# jtop hardcodes its data folder as sys.base_prefix + "/local/jtop", i.e.
# /usr/local/jtop, with no environment variable to steer it (jtop/core/config.py).
# In image mode /usr is read-only, so the service died on os.makedirs and systemd
# restarted it every 10 s forever -- and because it never finished starting, it
# reported "activating" rather than "failed", so the node looked healthy while a
# unit looped. The Containerfile points /usr/local/jtop at this directory instead.
#
# Shipped from /usr/lib rather than /etc: this is image content with no reason to
# be node-editable, and /etc costs a 3-way merge on every upgrade.
d /var/lib/jtop 0755 root root -
